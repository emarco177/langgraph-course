[project]
name = "langgraph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.5",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.24",
    "langgraph-cli[inmem]>=0.4.43",
    "pydantic>=2.14.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.37",
]

[tool.setuptools]
py-modules = ["ingestion"]

[tool.setuptools.packages.find]
include = ["graph*"]
